name: ZDOS Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Trigger VPS
        if: secrets.VPS_TOKEN != ''
        run: |
          curl -fsSL -X POST https://velvet.x-zdos.it/webhook/zdos-sync \
            -H "Authorization: Bearer ${{ secrets.VPS_TOKEN }}"
