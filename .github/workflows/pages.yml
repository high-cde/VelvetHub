name: Validate VelvetHub

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-velvethub
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test suite
        run: pnpm test

      - name: Bot safe-mode self-test
        run: pnpm bot:self-test

      - name: Production build
        run: pnpm build

      - name: Materialize static client routes
        run: |
          for route in accesso safety policy live live-preview discover studio inbox settings earnings admin community podcasts writing rewards store ourvelvet 404; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done
          cp dist/public/index.html dist/public/404.html
          find dist/public -name '*.html' -type f -exec sed -i 's#"/assets/#"/VelvetHub/assets/#g; s#"/VelvetHub/VelvetHub/assets/#"/VelvetHub/assets/#g' {} +

      - name: Upload build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: velvethub-static-build
          path: dist/public
          retention-days: 7
