name: ZDOS Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Status
        run: echo "VelvetHub aligned — Casa ufficiale $OV attiva. Workflow pulito."

      - name: Optional Trigger VPS
        if: ${{ secrets.VPS_TOKEN != '' }}
        run: |
          curl -fsSL -X POST https://ourvelvet.online/webhook/zdos-sync \
            -H "Authorization: Bearer ${{ secrets.VPS_TOKEN }}" || echo "VPS trigger optional — skipped or failed safely"
