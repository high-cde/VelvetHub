name: Deploy VelvetHub to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Materialize client routes for GitHub Pages
        run: |
          for route in accesso safety policy live live-preview discover studio earnings admin community podcasts writing rewards store ourvelvet 404; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done
      - name: Add SPA fallback for Pages
        run: cp dist/public/index.html dist/public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
